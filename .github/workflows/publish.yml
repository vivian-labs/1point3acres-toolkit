name: Publish to PyPI

on:
  workflow_run:
    workflows: [Project consistency]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of the version-bump commit on main (empty uses current main)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      version: ${{ steps.gate.outputs.version }}
      sha: ${{ steps.gate.outputs.sha }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - name: Select the tested commit
        id: source
        env:
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || inputs.commit || github.sha }}
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Require a version bump on main and successful CI for this exact commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release.py prepare
      - name: Build and validate distributions
        if: steps.gate.outputs.publish == 'true'
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build --outdir dist
          python -m twine check --strict dist/*
      - name: Refuse conflicting files already on PyPI
        if: steps.gate.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.gate.outputs.version }}
        run: python .github/scripts/release.py verify --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.gate.outputs.publish == 'true'
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/1point3acres-toolkit/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: pypi-distributions
          path: dist
      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          # Existing files were hash-checked above; allow a partial upload to resume.
          skip-existing: true

  release:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: pypi-distributions
          path: dist
      - name: Verify PyPI files before creating the matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        run: python .github/scripts/release.py release --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
